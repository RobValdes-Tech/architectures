version: '3.8'

services:
  # Base de datos documental para el Microservicio de Productos (Java)
  products-db:
    image: mongo:6.0
    container_name: products-mongodb
    restart: always
    ports:
      - "27017:27017" # Puerto estándar expuesto al host local
    environment:
      MONGO_INITDB_DATABASE: ProductsDb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: # Registro persistente de información local
