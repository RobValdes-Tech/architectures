# Puerto único para el microservicio de Java
server.port=8081

# Conexión local a la base de datos distribuida de MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/ProductsDb

# Configuración del Broker de Mensajería RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
